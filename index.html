<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{
background:#08192f;
display:flex;
justify-content:center;
align-items:center;

.card{

.subtitle{

margin-bottom:30px;
}

.btn{

background:#d4af37;
color:#08192f;
text-decoration:none;
padding:16px;
border-radius:12px;
margin:15px 0;
font-size:18px;
font-weight:bold;
}

.address{
margin-top:30px;
line-height:2;
color:#fff;
font-size:15px;
}

.footer{
margin-top:35px;
color:#d4af37;
font-size:13px;
line-height:1.8;
}

</style>
